name: Site (GitHub Pages)
# Publica o modo site: código + DADOS ABERTOS (CVM, Banco Central, Tesouro, BIS, Fed, BCE).
# Nenhum dado da B3 é publicado: cotações vêm de cada usuário, no próprio navegador.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '17 13 * * *' # 10h17 de Brasília: dados abertos do dia
    - cron: '47 1 * * *'  # 22h47 de Brasília: fechamento e atualizações da noite
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build:web
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
